# Uncomment the following line to enable OLED Displays
# CONFIG_ZMK_DISPLAY=y

# Deep sleep after 1 hour of no activity. Both halves enter system-off and
# wake on the first key press (matrix scan triggers the wake interrupt).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Trackballs need mouse-style BLE latency, not keyboard-style power saving.
# This costs some battery, but avoids intermittent pointer bursts/stalls.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
