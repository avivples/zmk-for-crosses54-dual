# Keep the right central -> left peripheral split link low-latency for raw
# left-trackball motion, especially after SCRSWAP moved role handling central.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=2
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8

# Passive Prospector scanner support. The right half is the split central, so
# only this side broadcasts keyboard status advertisements.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Crosses54"
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="RIGHT"
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=1
