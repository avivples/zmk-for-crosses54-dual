# The right half is the split central side. Report active layer changes for
# Keyboard Layers App Companion over USB raw HID and BLE keyboard HID.
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_LAYER_STATUS_USB_HID=y
CONFIG_ZMK_LAYER_STATUS_BLE_HID=y

# Use a distinct BLE PnP identity so the companion app does not confuse
# Crosses with other ZMK boards using the default 1d50:615e ID.
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0xA241
CONFIG_BT_DIS_PNP_PID=0xC054

# Keep the right central -> left peripheral split link low-latency for raw
# left-trackball motion, especially after SCRSWAP moved role handling central.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400
