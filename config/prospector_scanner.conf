# Prospector Scanner v2.2.1
# Non-touch mode: display only, no swipe navigation.
# Layout selection: CONFIG_PROSPECTOR_DEFAULT_LAYOUT=0..3
#   0=YADS, 1=Field, 2=Operator, 3=Radii

# Display configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# LVGL memory pool
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Reduce screen flickering with double buffering
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_VDB_SIZE=30

# Display thread stack
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

# FPU context sharing between threads prevents FPU register corruption on
# context switch.
CONFIG_FPU_SHARING=y

# GPIO for backlight
CONFIG_GPIO=y

# LVGL widgets
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_IMAGE=y

# Widgets for settings screens, compiled but not used in non-touch mode.
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_BUTTON=y

# Fonts
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_UNSCII_16=y

# Scanner mode
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_PROSPECTOR_MODE_SCANNER=y
CONFIG_PROSPECTOR_TOUCH_ENABLED=n

# Keep the same physical display orientation and brightness as the old
# Prospector dongle build.
CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=20

# PWM backlight
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# Stack overflow detection
CONFIG_STACK_SENTINEL=y

# This device is only a passive scanner, not a keyboard half or Studio target.
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_STUDIO=n
CONFIG_PM_DEVICE=n

# I2C is available for optional sensor hardware. The ambient sensor is disabled
# above for the non-touch/no-sensor setup.
CONFIG_I2C=y
